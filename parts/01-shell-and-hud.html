<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK OPS: ARENA</title>
<style>
/* ============================================================
   BLACK OPS: ARENA -- single-file raycast FPS
   HUD layout mirrors a BO2 multiplayer screen:
   minimap TL / medals TC / killfeed + score BL /
   "Killed" card BC / killstreaks + ammo BR
   ============================================================ */
:root{
  --gold:#ffc23a; --gold2:#ff9a1e;
  --blue:#4fc3ff; --red:#ff4433;
  --fx:'Impact','Haettenschweiler','Franklin Gothic Bold','Arial Narrow Bold',sans-serif;
  --ui:'Segoe UI','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
  --sh:0 2px 4px rgba(0,0,0,.85);
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:var(--ui)}
#wrap{position:fixed;inset:0;overflow:hidden;background:#05070a}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#view{z-index:1}
#fx{z-index:2;pointer-events:none}
.hidden{display:none!important}

#hud{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .35s ease}
#hud.on{opacity:1}

/* ---------- damage feedback ---------- */
#vig{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,0,0,0) 34%,rgba(190,10,0,.5) 74%,rgba(120,0,0,.9) 100%);
  transition:opacity .18s linear}
#lowhp{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(ellipse at center,rgba(255,0,0,0) 28%,rgba(150,0,0,.34) 82%,rgba(90,0,0,.72) 100%)}
#flash{position:absolute;inset:0;z-index:6;pointer-events:none;background:#fff;opacity:0}
#dirs{position:absolute;left:50%;top:50%;width:0;height:0;z-index:5;pointer-events:none}
.dind{position:absolute;left:-15px;top:-165px;width:30px;height:36px;
  background:linear-gradient(180deg,rgba(255,60,40,.95),rgba(255,60,40,0));
  clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:15px 165px;
  filter:drop-shadow(0 0 6px rgba(255,40,20,.85))}

/* ---------- TOP LEFT : minimap ---------- */
#mini{position:absolute;left:20px;top:18px;width:150px;height:150px;z-index:5;
  background:rgba(6,14,22,.55);border:2px solid rgba(228,236,242,.55);border-radius:4px;
  box-shadow:0 4px 18px rgba(0,0,0,.55),inset 0 0 24px rgba(0,0,0,.5);overflow:hidden}
#mini canvas{position:static;width:100%;height:100%}
#mini::before,#mini::after{content:'';position:absolute;width:12px;height:12px;border:2px solid rgba(255,255,255,.85)}
#mini::before{left:3px;top:3px;border-right:0;border-bottom:0}
#mini::after{right:3px;bottom:3px;border-left:0;border-top:0}
#mini .uavtag{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:8px;font-weight:900;
  letter-spacing:3px;color:var(--blue);opacity:0;transition:.3s;text-shadow:var(--sh)}
#mini.uav .uavtag{opacity:1}
#mini .sweep{position:absolute;left:0;right:0;height:38px;opacity:0;transition:.3s;
  background:linear-gradient(180deg,rgba(79,195,255,0),rgba(79,195,255,.20))}
#mini.uav .sweep{opacity:1;animation:sweep 2.4s linear infinite}
@keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(152px)}}

/* ---------- TOP CENTRE : emblem, medals, points, banner ---------- */
#topc{position:absolute;left:0;right:0;top:8px;z-index:5;text-align:center}
#emblem{width:42px;height:48px;margin:0 auto;position:relative;
  background:linear-gradient(180deg,#e6eef5,#93aabd 52%,#5f748a);
  clip-path:polygon(50% 0,100% 16%,100% 62%,50% 100%,0 62%,0 16%);
  box-shadow:0 3px 10px rgba(0,0,0,.6);opacity:.92}
#emblem::after{content:'';position:absolute;inset:3px;
  background:linear-gradient(180deg,#2f4f6d,#16293c);
  clip-path:polygon(50% 0,100% 16%,100% 62%,50% 100%,0 62%,0 16%)}
#emblem i{position:absolute;left:50%;top:30%;width:20px;height:20px;margin-left:-10px;z-index:2;
  border:3px solid #cfe4f5;border-top:0;border-right:0;transform:rotate(-45deg);
  box-shadow:-2px 2px 0 rgba(0,0,0,.35)}
#medals{margin-top:8px}
.medal{font-family:var(--ui);font-weight:700;font-size:clamp(13px,1.35vw,19px);letter-spacing:3.6px;
  color:#fff;text-shadow:0 0 14px rgba(0,0,0,.9),0 2px 3px rgba(0,0,0,.95);
  margin:3px 0;animation:medalIn .42s cubic-bezier(.15,1.5,.4,1) both;text-transform:uppercase}
.medal .sub{display:block;font-size:.62em;letter-spacing:5px;color:var(--gold);
  text-shadow:var(--sh);margin-top:1px}
.medal.out{animation:medalOut .55s ease forwards}
@keyframes medalIn{0%{opacity:0;transform:scale(1.7);filter:blur(6px)}
  60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1)}}
@keyframes medalOut{to{opacity:0;transform:scale(.94) translateY(-10px)}}
#pts{margin-top:4px;min-height:26px}
.pt{font-family:var(--fx);font-size:clamp(16px,1.9vw,26px);color:var(--gold);letter-spacing:2px;
  text-shadow:0 0 12px rgba(255,170,20,.7),0 2px 0 rgba(0,0,0,.9);transform:skewX(-8deg);
  animation:ptFloat 1.3s ease-out forwards}
@keyframes ptFloat{0%{opacity:0;transform:skewX(-8deg) translateY(14px) scale(1.4)}
  20%{opacity:1;transform:skewX(-8deg) translateY(0) scale(1)}
  100%{opacity:0;transform:skewX(-8deg) translateY(-46px) scale(.92)}}
#ann{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:4px;
  color:#dbe6ef;text-shadow:var(--sh);opacity:0;transition:opacity .3s}
#ann.on{opacity:1}

/* ---------- CENTRE : pickup prompt ---------- */
#pick{position:absolute;left:50%;top:54%;transform:translateX(-50%);z-index:5;text-align:center;
  opacity:0;transition:opacity .12s;white-space:nowrap}
#pick.on{opacity:1}
#pick .row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
  letter-spacing:1.2px;text-shadow:var(--sh)}
#pick .k{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  padding:0 5px;border:2px solid #fff;border-radius:4px;font-weight:900;font-size:12px;
  background:rgba(0,0,0,.4)}
#pick .ring{margin:8px auto 0;width:160px;height:3px;background:rgba(255,255,255,.22);
  border-radius:2px;overflow:hidden}
#pick .ring i{display:block;height:100%;width:0%;background:var(--gold)}

/* ---------- BOTTOM LEFT : killfeed + score ---------- */
#feed{position:absolute;left:22px;bottom:104px;z-index:5;display:flex;flex-direction:column-reverse;gap:3px}
.kf{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;letter-spacing:.3px;
  text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.9);white-space:nowrap;width:fit-content;
  padding:1px 0;animation:kfIn .25s ease both}
@keyframes kfIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.kf.out{animation:kfOut .4s ease forwards}
@keyframes kfOut{to{opacity:0;transform:translateX(-16px)}}
.kf .wp{color:#e8eef4;font-family:var(--fx);letter-spacing:1px;font-size:14px;opacity:.95}
.kf .wp.hs{color:var(--gold)}
.kf b{font-weight:600;opacity:.62;margin-right:2px}
.t-f{color:#7fd0ff}.t-e{color:#ff7b66}.t-me{color:var(--gold)}

#score{position:absolute;left:22px;bottom:24px;z-index:5;display:flex;align-items:center;gap:14px}
#clock{font-family:var(--fx);font-size:26px;letter-spacing:.5px;color:#fff;text-shadow:0 2px 3px #000;
  transform:skewX(-6deg)}
#clock.low{color:#ff6152;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
#score .rows{display:flex;flex-direction:column;gap:2px}
#score .tm{display:flex;align-items:center;gap:8px}
#score .tm i{width:15px;height:15px;display:block;transform:rotate(45deg);border:2px solid #fff}
#score .tm.f i{background:rgba(79,195,255,.85);border-color:#cfeeff;box-shadow:0 0 8px rgba(79,195,255,.7)}
#score .tm.e i{background:rgba(255,68,51,.85);border-color:#ffd2cc;box-shadow:0 0 8px rgba(255,68,51,.7)}
#score .tm span{font-family:var(--fx);font-size:25px;line-height:1;color:#fff;
  text-shadow:0 2px 3px #000;transform:skewX(-6deg);min-width:38px}

/* ---------- BOTTOM CENTRE : "Killed" card ---------- */
#killed{position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);z-index:5;
  display:flex;align-items:center;gap:9px;padding:6px 14px 6px 10px;opacity:0;transition:.22s;
  background:linear-gradient(90deg,rgba(8,12,17,.86),rgba(8,12,17,.62));
  border:1px solid rgba(255,255,255,.13);border-radius:3px}
#killed.on{opacity:1;transform:translateX(-50%) translateY(0)}
#killed .lbl{font-size:11px;font-weight:800;letter-spacing:3px;color:#c3d2de;text-shadow:var(--sh)}
#killed .ic{width:22px;height:22px;background:rgba(200,40,25,.9);border-radius:2px;position:relative;
  box-shadow:0 0 10px rgba(255,50,30,.5)}
#killed .ic::before,#killed .ic::after{content:'';position:absolute;left:4px;top:9.6px;width:14px;height:2.6px;
  background:#fff;border-radius:2px}
#killed .ic::before{transform:rotate(45deg)}
#killed .ic::after{transform:rotate(-45deg)}
#killed .nm{font-size:14px;font-weight:700;letter-spacing:.6px;color:#fff;text-shadow:var(--sh)}
#killed .nm b{font-weight:600;opacity:.6;margin-right:3px}

/* ---------- BOTTOM RIGHT : killstreaks + ammo ---------- */
#rightcol{position:absolute;right:24px;bottom:22px;z-index:5;display:flex;flex-direction:column;
  align-items:flex-end;gap:12px}
#streaks{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.ks{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,rgba(12,18,25,.72),rgba(12,18,25,.42));
  border:1px solid rgba(255,255,255,.20);border-radius:3px;opacity:.42;filter:grayscale(1);
  transition:all .3s}
.ks canvas{position:static;width:30px;height:30px}
.ks .tx{display:none;position:absolute;right:50px;top:50%;transform:translateY(-50%);
  white-space:nowrap;text-align:right;text-shadow:var(--sh)}
.ks .tx b{display:block;font-size:11px;font-weight:800;letter-spacing:1.6px;color:#fff}
.ks .tx s{display:block;text-decoration:none;font-size:8.5px;letter-spacing:2.4px;color:var(--gold)}
.ks .key{position:absolute;right:-3px;top:-4px;font-size:8.5px;font-weight:900;color:#0b0d10;
  background:var(--gold);padding:1px 4px;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.ks.ready{opacity:1;filter:none;border-color:rgba(255,194,58,.8);
  box-shadow:0 0 16px rgba(255,170,30,.35);animation:ksIn .45s cubic-bezier(.2,1.6,.4,1) both}
.ks.ready .tx{display:block}
@keyframes ksIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}

#ammo{text-align:right;line-height:1}
#ammo .gun{font-size:9.5px;letter-spacing:3px;font-weight:800;color:#9fb2c2;text-shadow:var(--sh)}
#ammo .fire{font-size:11px;letter-spacing:3.4px;font-weight:800;color:#dbe6ef;margin:3px 0 2px;
  text-shadow:var(--sh)}
#ammo .n{font-family:var(--fx);transform:skewX(-8deg);text-shadow:0 3px 0 rgba(0,0,0,.75),0 0 20px rgba(0,0,0,.9)}
#mag{font-size:46px;color:#fff}
#mag.low{color:#ff5f4c}
#res{font-size:31px;color:#c3d2de}
#reloadbar{position:absolute;right:24px;bottom:8px;width:150px;height:3px;background:rgba(255,255,255,.16);
  border-radius:2px;overflow:hidden;z-index:5;opacity:0;transition:opacity .15s}
#reloadbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold2),var(--gold))}

/* ---------- TAB scoreboard ---------- */
#board{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
  background:rgba(3,6,10,.72)}
#board .card{width:min(760px,92vw);background:linear-gradient(180deg,rgba(12,18,24,.97),rgba(8,12,17,.97));
  border:1px solid rgba(255,255,255,.13);border-radius:5px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#board h3{margin:0;padding:13px 18px;font-family:var(--fx);letter-spacing:4px;font-size:20px;
  transform:skewX(-8deg);background:linear-gradient(90deg,rgba(255,194,58,.16),transparent)}
#board table{width:100%;border-collapse:collapse;font-size:13px}
#board th{font-size:9.5px;letter-spacing:2.5px;color:#8fa3b4;text-align:left;padding:7px 18px;font-weight:800}
#board td{padding:6px 18px;border-top:1px solid rgba(255,255,255,.055)}
#board tr.friend td:first-child{border-left:3px solid var(--blue)}
#board tr.enemy td:first-child{border-left:3px solid var(--red)}
#board tr.you{background:rgba(255,194,58,.12)}
#board tr.you td{color:var(--gold);font-weight:800}

/* ---------- menus ---------- */
#menu{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(14,22,30,.84),rgba(3,5,8,.96))}
.panel{width:min(660px,94vw);max-height:92vh;overflow:auto;
  background:linear-gradient(180deg,rgba(13,19,26,.96),rgba(7,11,15,.98));
  border:1px solid rgba(255,255,255,.12);border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.75)}
.panel .hd{padding:20px 26px 14px;border-bottom:1px solid rgba(255,255,255,.09);
  background:linear-gradient(90deg,rgba(255,194,58,.12),transparent)}
.panel h1{margin:0;font-family:var(--fx);font-size:clamp(28px,5vw,46px);letter-spacing:5px;
  transform:skewX(-8deg);text-shadow:0 0 30px rgba(255,170,30,.35);line-height:1}
.panel h1 em{font-style:normal;color:var(--gold)}
.panel .sub{margin-top:6px;font-size:10.5px;letter-spacing:4px;color:#8ea3b5;font-weight:800}
.panel .bd{padding:18px 26px 24px}
.btn{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;cursor:pointer;
  background:linear-gradient(90deg,rgba(255,255,255,.075),rgba(255,255,255,.02));color:#fff;
  border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--gold);border-radius:3px;
  font-family:var(--ui);font-size:13.5px;font-weight:800;letter-spacing:2.5px;transition:.15s;pointer-events:auto}
.btn:hover{background:linear-gradient(90deg,rgba(255,194,58,.24),rgba(255,255,255,.03));transform:translateX(4px)}
.btn small{display:block;font-weight:600;letter-spacing:.6px;color:#93a7b8;margin-top:3px;font-size:11px}
.btn.sm{display:inline-block;width:auto;margin:0;padding:8px 14px;font-size:11px;border-left-width:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.055);font-size:12.5px;letter-spacing:.6px}
.row span{color:#c6d4e0}
.keyb{min-width:96px;text-align:center;padding:7px 10px;background:rgba(255,255,255,.07);cursor:pointer;
  border:1px solid rgba(255,255,255,.16);border-radius:3px;font-weight:800;font-size:11.5px;
  letter-spacing:1.5px;color:#fff;pointer-events:auto;transition:.15s}
.keyb:hover{background:rgba(255,194,58,.25);border-color:var(--gold)}
.keyb.wait{background:var(--gold);color:#000;animation:pulse .7s infinite}
input[type=range]{width:170px;accent-color:var(--gold);pointer-events:auto}
.sect{margin:16px 0 8px;font-size:10px;letter-spacing:3.5px;color:var(--gold);font-weight:900}
.tip{font-size:11.5px;color:#8ea3b5;line-height:1.8}
kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;font-size:10.5px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px;text-align:center}
.stats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:3px;padding:10px 4px}
.stats b{display:block;font-family:var(--fx);font-size:28px;transform:skewX(-8deg);color:var(--gold)}
.stats s{display:block;text-decoration:none;font-size:9px;letter-spacing:2px;color:#8ea3b5;margin-top:2px}
#endTitle{font-family:var(--fx);font-size:clamp(34px,7vw,66px);letter-spacing:7px;transform:skewX(-8deg);
  text-align:center;margin:6px 0 2px}
.win{color:#8fe3ff;text-shadow:0 0 34px rgba(79,195,255,.7)}
.lose{color:#ff7a68;text-shadow:0 0 34px rgba(255,60,40,.6)}
#loading{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:#05070a;font-family:var(--fx);letter-spacing:6px;font-size:22px;color:var(--gold)}

/* ---------- touch controls (phones / tablets) ---------- */
#touch{position:absolute;inset:0;z-index:6;display:none;touch-action:none}
#touch.on{display:block}
#stickBase{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
  border:2px solid rgba(255,255,255,.30);background:rgba(0,0,0,.16);opacity:0;
  transition:opacity .15s;pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;
  background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.55);
  transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.tbtn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(10,16,22,.40);border:2px solid rgba(255,255,255,.34);color:#fff;font-weight:800;
  letter-spacing:1px;font-size:11px;text-shadow:0 1px 3px #000;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);transition:transform .06s,background .06s}
.tbtn.down{background:rgba(255,194,58,.48);border-color:var(--gold);transform:scale(.93)}
.tbtn.active{border-color:var(--gold);background:rgba(255,194,58,.26)}
#bFire{right:24px;bottom:92px;width:104px;height:104px;font-size:14px}
#bAds{right:146px;bottom:146px;width:74px;height:74px}
#bReload{right:146px;bottom:48px;width:62px;height:62px}
#bJump{right:24px;bottom:208px;width:62px;height:62px}
#bCrouch{right:100px;bottom:230px;width:54px;height:54px}
#bSwap{right:24px;bottom:20px;width:58px;height:58px}
#bMelee{right:100px;bottom:20px;width:54px;height:54px}
#bUse{left:50%;bottom:112px;margin-left:-34px;width:68px;height:68px}
#bMenu{right:16px;top:14px;width:42px;height:42px;font-size:15px}
#touch.lefty #bFire{right:auto;left:24px}
#touch.lefty #bAds{right:auto;left:146px}
#touch.lefty #bReload{right:auto;left:146px}
#touch.lefty #bJump{right:auto;left:24px}
#touch.lefty #bCrouch{right:auto;left:100px}
#touch.lefty #bSwap{right:auto;left:24px}
#touch.lefty #bMelee{right:auto;left:100px}
#rotate{position:absolute;inset:0;z-index:11;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;background:#05070a;color:var(--gold);text-align:center;padding:30px;
  font-family:var(--fx);letter-spacing:5px;font-size:20px}
#rotate.on{display:flex}
#rotate i{display:block;width:56px;height:88px;border:3px solid var(--gold);border-radius:8px;
  animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(90deg)}}

/* ---------- small screens ---------- */
@media (max-width:900px),(max-height:560px){
  #mini{width:104px;height:104px;left:12px;top:12px}
  #score{left:12px;bottom:12px;gap:10px}
  #clock{font-size:19px}
  #score .tm span{font-size:19px;min-width:26px}
  #score .tm i{width:11px;height:11px}
  #feed{left:12px;bottom:70px}
  .kf{font-size:10.5px;gap:4px}
  .kf .wp{font-size:11.5px}
  #mag{font-size:30px}
  #res{font-size:20px}
  #ammo .fire{font-size:9px;letter-spacing:2px}
  #ammo .gun{font-size:8px;letter-spacing:2px}
  .ks{width:34px;height:34px}
  .ks canvas{width:23px;height:23px}
  .ks .tx{display:none!important}
  .medal{font-size:14px;letter-spacing:2px}
  #pts .pt{font-size:16px}
  #topc{top:4px}
  #emblem{width:28px;height:32px}
  #emblem i{width:13px;height:13px;margin-left:-6.5px;border-width:2px}
  #killed{bottom:10px;padding:4px 10px;gap:6px}
  #killed .nm{font-size:11px}
  #killed .lbl{font-size:9px;letter-spacing:2px}
  #killed .ic{width:16px;height:16px}
  #killed .ic::before,#killed .ic::after{left:3px;top:6.8px;width:10px;height:2.2px}
  #pick .row{font-size:12px}
  #pick .ring{width:120px}
  .panel .bd{padding:14px 18px 18px}
  .grid2{grid-template-columns:1fr}
}
/* on touch the ammo block moves out from under the fire button */
body.touch #rightcol{bottom:auto;top:12px;right:64px;flex-direction:column-reverse}
